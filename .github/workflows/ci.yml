name: CI

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsefit
          POSTGRES_PASSWORD: pulsefit
          POSTGRES_DB: gym_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsefit -d gym_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://pulsefit:pulsefit@localhost:5432/gym_management_test
      TEST_DATABASE_URL: postgresql://pulsefit:pulsefit@localhost:5432/gym_management_test
      JWT_SECRET: ci-only-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
