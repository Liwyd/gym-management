name: pulsefit

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsefit}
      POSTGRES_DB: ${POSTGRES_DB:-gym_management}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pulsefit} -d $${POSTGRES_DB:-gym_management}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: ${DOCKERHUB_USER:-liwyd}/pulsefit-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsefit}:${POSTGRES_PASSWORD:-pulsefit}@postgres:5432/${POSTGRES_DB:-gym_management}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ${DOCKERHUB_USER:-liwyd}/pulsefit-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Rewrites are baked at build time; this only matters if the image is
      # reconfigured without a rebuild (kept for clarity).
      BACKEND_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
